device: 'cuda:0'
debug: False
train_mode: 'offline'

input_obs: "rgb"
output_obs: "mask"

deterministic_latent_dim: 300 ## 200
stochastic_latent_dim: 60 ## 30
action_dim: 4
hidden_dim: 300 ## 200
embedding_dim: 1024
min_std_dev: 0.1
activation: 'relu'
trans_layers: 1
input_obs_dim: [3, 64, 64]
output_obs_dim: [1, 64, 64]
encoder_batchnorm: False
encoder_residual: False
decoder_batchnorm: False
decoder_residual: False
no_op: [1, 1, 1, 1]
free_nats: 1
symlog: False
# data_sampler: "count-based"

state_layers: 2
observation_scale: 1.0
reward_scale: 1.0
reward_gradient_stop: False
kl_balance: 0.8
kl_scale: 1.0
kl_balancing: True
reward_layers: 5 #3

overshooting_distance: 2  
kl_overshooting_scale: 0.1
kl_overshooting_warmup: True
kl_overshooting_balance: 1.0
reward_overshooting_scale: 0.1
reward_overshooting_warmup: False

optimiser_class: 'adam'
optimiser_params: 
  lr: 1e-3
  eps: 1e-4
grad_clip_norm: 1000

batch_size: 2
sequence_size: 50
total_update_steps: 4
test_interval: 2
validation_interval: 2

refresh_init_state: False

action_output:
  norm-pixel-pick-and-place:
    pick_0: [0, 1]
    place_0: [2, 3]

apply_transform_in_dataset: True

dataloader_workers: 0
dataloader_prefetch_factor: 1

apply_reward_processor: True

transform:
  name: 'pick_and_place_transformer_v1'
  params:
    img_dim: [64, 64]
    remap_image: [0, 1]
    device: "cuda:0"
    rgb_norm_mode: ['remap']
    rgb_norm_param:
      remap_range: [0, 1]
    rgb_noise_factor: 0.01
    random_rotation: True
    random_terminal: False
    rotation_degree: 1
    all_goal_rotate: True
    goal_translate: 0.2
    preserve_goal_mask: True
    vertical_flip: True
    random_resize: False
    action_noise: 0.0
    depth_clip: True
    depth_clip_min: 1.8 #
    depth_clip_max: 2.0 #0.66
    min_max_norm: True
    depth_min: 1.8
    depth_max: 2.0
    depth_map: True
    depth_map_range: [0, 1]
    depth_blur: True
    depth_flip: True
    depth_blur_kernel_size: 2
    depth_noise_var: 0.01
    depth_eval_process: True
    maskout: True
    bg_value: 0


encoder_mode: "default"
cost_fn: "trajectory_return"

logger_name: "pick_and_place_fabric_single_task_logger"


datasets:
  - key: 'train'

    name: 'default'
    params:
      data_path: 'smoke_compressed' #'diffusion_policy_on_softgym|domain:cloth-funnel-real2sim-longsleeve,task:flattening,horizon:20'
      data_dir: './data/datasets'
      seq_length: 50
      cross_trajectory: True
      split_ratios: [0.2, 0.2, 0.6]
      io_mode: 'r'
      sample_mode: 'train'
      obs_config: 
        mask: 
          shape: [64, 64, 1]
          output_key: 'mask'
        rgb:
          shape: [64, 64, 3]
          output_key: 'rgb'
        goal-mask: 
          shape: [64, 64, 1]
          output_key: 'goal-mask'
        goal-rgb:
          shape: [64, 64, 3]
          output_key: 'goal-rgb'
        speedFolding_approx:
          shape: [1]
          output_key: 'reward'
        
        normalised_coverage:
          shape: [1]
          output_key: 'normalised_coverage'
      
      act_config:
        norm-pixel-pick-and-place: 
          shape: [4]
          output_key: 'default'
      

  - key: 'test'

    name: 'default'
    params:
      data_path: 'smoke_compressed'
      data_dir: './data/datasets'
      seq_length: 20
      cross_trajectory: False
      io_mode: 'r'
      sample_mode: 'eval'
      split_ratios: [0.2, 0.2, 0.6]
      sample_terminal: True
      obs_config: 
        mask: 
          shape: [64, 64, 1]
          output_key: 'mask'
        rgb:
          shape: [64, 64, 3]
          output_key: 'rgb'
        goal-mask: 
          shape: [64, 64, 1]
          output_key: 'goal-mask'
        goal-rgb:
          shape: [64, 64, 3]
          output_key: 'goal-rgb'
        speedFolding_approx:
          shape: [1]
          output_key: 'reward'

        normalised_coverage:
          shape: [1]
          output_key: 'normalised_coverage'
        
      
      act_config:
        norm-pixel-pick-and-place: 
          shape: [4]
          output_key: 'default'

    

policy:
  name: 'rect_fabric_cloth_mask_mpc'
  params:
    candidates: 5000
    planning_horizon: 1
    iterations: 100
    clip: True
    swap_action: False
    cloth_mask: "from_env"

    cost_fn: 'from_model'


test_horizons: [1, 2, 4] # This shoulud be smaller than action horizon.
action_horizon: 50
eval_episodes: 1
eval_action_horizon: 20
eval_save_latent: True