# Build, check and publish actoris-harena.
#
# A tag vX.Y.Z publishes to TestPyPI, then to PyPI. Running it by hand
# (workflow_dispatch) stops after TestPyPI. Both uploads use trusted publishing
# (OIDC), so no token is stored; documents/releasing.md has the one-time setup.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # Every data directory the package reads at run time, file for file.
      - run: python tool/check_wheel.py dist
      # The rig side, installed from the wheel alone, imports without the sim stack.
      - run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$(ls dist/*.whl)[rig]"
          cd /tmp && /tmp/v/bin/python -c "import actoris_harena.recording, actoris_harena.web.console"
          /tmp/v/bin/actoris-harena --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/actoris-harena
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/actoris-harena
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
